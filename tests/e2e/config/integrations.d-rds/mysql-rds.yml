integrations:
  - name: nri-mysql
    env:
      USERNAME: ${RDS_USER}
      PASSWORD: ${RDS_PASSWORD}
      HOSTNAME: ${RDS_HOST}
      PORT: ${RDS_PORT:-3306}
      DATABASE: ${RDS_DB:-mysql}

      ENABLE_TLS: ${RDS_ENABLE_TLS:-true}
      REMOTE_MONITORING: "true"

      EXTENDED_METRICS: "true"

      # ── Observability flags ────────────────────────────────────────────
      COLLECT_CONNECTION_TIMING: "true"
      AVAILABILITY_CHECK_QUERY: "SELECT 1"
      AVAILABILITY_CHECK_TIMEOUT_MS: "5000"
      COLLECT_QUERY_TELEMETRY: "true"

    interval: 30s
    labels:
      team: go-dev
      service_type: mysql
      environment: e2e-rds
      region: us-east-1
      geo: us
      service_name: rds-mysql
      instance: rds-mysql
      role: primary
