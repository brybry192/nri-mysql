integrations:

  # ── Primary (e2e-mysql-1) ──────────────────────────────────────────────────
  - name: nri-mysql
    env:
      USERNAME: root
      PASSWORD: e2e_test_password
      HOSTNAME: e2e-mysql-1
      PORT: "3306"
      DATABASE: demo
      REMOTE_MONITORING: "true"

      EXTENDED_METRICS: "true"
      EXTENDED_INNODB_METRICS: "true"

      # ── Observability flags (all enabled for E2E validation) ───────────
      COLLECT_CONNECTION_TIMING: "true"
      AVAILABILITY_CHECK_QUERY: "SELECT 1"
      AVAILABILITY_CHECK_TIMEOUT_MS: "5000"
      COLLECT_QUERY_TELEMETRY: "true"

    interval: 10s
    labels:
      team: go-dev
      service_type: mysql
      environment: testing
      region: local.docker
      geo: us
      service_name: e2e-mysql
      instance: e2e-mysql-1
      role: primary
      availability_zone: 2a

  # ── Replica (e2e-mysql-2) ──────────────────────────────────────────────────
  # Uses implicit ping-based availability (no explicit query) to demonstrate
  # the difference between the two check tiers on the dashboard.
  - name: nri-mysql
    env:
      USERNAME: root
      PASSWORD: e2e_test_password
      HOSTNAME: e2e-mysql-2
      PORT: "3306"
      DATABASE: demo
      REMOTE_MONITORING: "true"

      EXTENDED_METRICS: "true"
      EXTENDED_INNODB_METRICS: "true"

      # ── Observability flags ──────────────────────────────────────────────
      # Implicit availability only — ping + DNS/TCP timing, no canary query.
      COLLECT_CONNECTION_TIMING: "true"
      COLLECT_QUERY_TELEMETRY: "true"

    interval: 10s
    labels:
      team: go-dev
      service_type: mysql
      environment: testing
      region: local.docker
      geo: us
      service_name: e2e-mysql
      instance: e2e-mysql-2
      role: replica
      availability_zone: 2b

  # ── Slow check (e2e-mysql-1, same host) ───────────────────────────────────
  # Deliberately slow canary query — SELECT SLEEP(5) takes 5 seconds, giving
  # the chaos test a reliable window to find and KILL the connection mid-query.
  # Used by test-availability.sh to demonstrate TCP RST / connection-killed
  # error classification. No metric collection (just availability probes).
  - name: nri-mysql
    env:
      USERNAME: root
      PASSWORD: e2e_test_password
      HOSTNAME: e2e-mysql-1
      PORT: "3306"
      DATABASE: demo
      REMOTE_MONITORING: "true"

      # ── Observability flags ──────────────────────────────────────────────
      COLLECT_CONNECTION_TIMING: "true"
      AVAILABILITY_CHECK_QUERY: "SELECT SLEEP(5)"
      AVAILABILITY_CHECK_TIMEOUT_MS: "10000"
      COLLECT_QUERY_TELEMETRY: "true"

    interval: 15s
    labels:
      team: go-dev
      service_type: mysql
      environment: testing
      region: local.docker
      geo: us
      service_name: e2e-mysql
      instance: e2e-mysql-1-slowcheck
      role: slowcheck
      availability_zone: 2a

  # ── Standalone (e2e-inventorydb) ───────────────────────────────────────────
  # A separate deploy — different service_name, its own database.
  # Uses explicit canary query for availability.
  - name: nri-mysql
    env:
      USERNAME: root
      PASSWORD: e2e_test_password
      HOSTNAME: e2e-inventorydb
      PORT: "3306"
      DATABASE: inventory
      REMOTE_MONITORING: "true"

      EXTENDED_METRICS: "true"
      EXTENDED_INNODB_METRICS: "true"

      # ── Observability flags ──────────────────────────────────────────────
      COLLECT_CONNECTION_TIMING: "true"
      AVAILABILITY_CHECK_QUERY: "SELECT 1"
      AVAILABILITY_CHECK_TIMEOUT_MS: "5000"
      COLLECT_QUERY_TELEMETRY: "true"

    interval: 10s
    labels:
      team: go-dev
      service_type: mysql
      environment: testing
      region: local.docker
      geo: us
      service_name: inventorydb
      instance: e2e-inventorydb
      role: standalone
      availability_zone: 2a
